[project]
name = "fastapi-authn"
version = "0.1.0"
description = "Authentication for FastAPI: security schemes, chains, Starlette middleware and an OAuth authorization server"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yurii Karabas", email = "1998uriyyo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastapi-injected>=0.3.6",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# OAuth building blocks
jwt = ["pyjwt[crypto]>=2.10.1"]
oidc = ["fastapi-authn[jwt]", "httpx2>=2.10.0"]
introspection = ["httpx2>=2.10.0"]
oauth2 = ["httpx2>=2.10.0"]
# Authorization server storage
encrypted = ["cryptography>=42.0.0"]
redis = ["redis>=5.0.0"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.0"]
# fastapi_authn.ext: one extra per vendor
auth0 = ["fastapi-authn[oidc]"]
clerk = ["fastapi-authn[jwt]"]
cognito = ["fastapi-authn[jwt]"]
entra = ["fastapi-authn[oidc]"]
firebase = ["fastapi-authn[jwt]"]
github = ["fastapi-authn[oauth2]"]
google = ["fastapi-authn[oidc]"]
keycloak = ["fastapi-authn[oidc]"]
okta = ["fastapi-authn[oidc]"]
supabase = ["fastapi-authn[jwt]"]
all = [
    "fastapi-authn[jwt,oidc,introspection,oauth2,encrypted,redis,sqlalchemy]",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.0",
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty==0.0.85",
]
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ALL",  # select all checks by default
]
ignore = [
    # single rule exclude
    "ASYNC240", # allow async functions to use pathlib.Path methods
    "B008",    # do not perform function calls in argument defaults
    "S101",    # use of assert detected
    "S105",    # OAuth names everything `token_*`; nothing hardcoded here is a secret
    "SIM114",  # allow have multiple ifs with same body
    "TRY003",  # allow long exc message
    "RUF100",  # allow unused noqa
    "RUF012",  # allow mutable class var
    "COM812",  # will be handled by ruff format
    "ISC001",  # will be handled by ruff format
    "SLF001",  # allow access to private member
    "N806",    # allow variable name to start from uppercase letter
    "N805",    # ignore first argument name check
    "N818",    # ignore exception name should ends with Error suffix
    "FAST002", # allow to use non-annotated dependencies
    "PLR0913", # allow more than 5 arguments
    "PLR2004", # allow to compare with "magic numbers"
    "PLR0917", # allow too many positional arguments
    "PLW0108", # allow lambda with unnecessary function call
    "TC001",   # ignore moving things to if TYPE_CHECKING block
    "TC002",   # ignore moving things to if TYPE_CHECKING block
    "TC003",   # ignore moving things to if TYPE_CHECKING block
    "A005",    # allow module name to shadow a Python standard-library module
    "TC006",   # ignore quotes in typing.cast calls
    "PLC0415", # allow to have local imports
    "CPY001",  # ignore copyright

    # full rule exclude
    "D",    # ignore docstrings
    "FA",  # ignore future annotations
    "ANN", # ignore annotations
    "FIX", # ignore FIXMEs
    "TD",  # ignore all TODOs
    "ARG", # ignore unused arguments
    "FBT", # ignore flake8-boolean-trap
    "EM",  # ignore error message formatting
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python = ".venv"
